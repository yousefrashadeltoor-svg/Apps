name: Build JObat Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jobat.yml'
      - 'android-document-reader-development.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract selected native Android project
        run: |
          mkdir -p candidate
          unzip -q android-document-reader-development.zip -d candidate
          test -f candidate/JObat/settings.gradle.kts
          test -f candidate/JObat/app/src/main/AndroidManifest.xml

      - name: Repair missing bundled font resources
        run: |
          cat > candidate/JObat/design-system/src/main/kotlin/com/jobat/design/theme/Type.kt <<'KOTLIN'
          package com.jobat.design.theme

          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Shapes
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          // The source archive references font resources that are not included in the ZIP.
          // Use Android's bundled type families so the app remains fully offline and builds reliably.
          val DisplayFamily = FontFamily.Serif
          val UiFamily = FontFamily.SansSerif
          val UiArabicFamily = FontFamily.SansSerif

          private fun style(family: FontFamily, size: Int, line: Int, weight: Int, tracking: Float) = TextStyle(
              fontFamily = family,
              fontSize = size.sp,
              lineHeight = line.sp,
              fontWeight = FontWeight(weight),
              letterSpacing = tracking.sp,
          )

          private fun fam(key: String) = if (key == "display") DisplayFamily else UiFamily

          val JoBatTypography = with(JoBatTokens.Type) {
              Typography(
                  displayLarge = style(fam(displayLargeFamily), displayLargeSize.value.toInt(), displayLargeLine.value.toInt(), displayLargeWeight, displayLargeTracking.value),
                  displaySmall = style(fam(displaySmallFamily), displaySmallSize.value.toInt(), displaySmallLine.value.toInt(), displaySmallWeight, displaySmallTracking.value),
                  headlineMedium = style(fam(headlineMediumFamily), headlineMediumSize.value.toInt(), headlineMediumLine.value.toInt(), headlineMediumWeight, headlineMediumTracking.value),
                  titleLarge = style(fam(titleLargeFamily), titleLargeSize.value.toInt(), titleLargeLine.value.toInt(), titleLargeWeight, titleLargeTracking.value),
                  titleMedium = style(fam(titleMediumFamily), titleMediumSize.value.toInt(), titleMediumLine.value.toInt(), titleMediumWeight, titleMediumTracking.value),
                  bodyLarge = style(fam(bodyLargeFamily), bodyLargeSize.value.toInt(), bodyLargeLine.value.toInt(), bodyLargeWeight, bodyLargeTracking.value),
                  bodyMedium = style(fam(bodyMediumFamily), bodyMediumSize.value.toInt(), bodyMediumLine.value.toInt(), bodyMediumWeight, bodyMediumTracking.value),
                  labelLarge = style(fam(labelLargeFamily), labelLargeSize.value.toInt(), labelLargeLine.value.toInt(), labelLargeWeight, labelLargeTracking.value),
                  labelSmall = style(fam(labelSmallFamily), labelSmallSize.value.toInt(), labelSmallLine.value.toInt(), labelSmallWeight, labelSmallTracking.value),
              )
          }

          val JoBatShapes = Shapes(
              extraSmall = RoundedCornerShape(JoBatTokens.Radius.sm),
              small = RoundedCornerShape(JoBatTokens.Radius.sm),
              medium = RoundedCornerShape(JoBatTokens.Radius.md),
              large = RoundedCornerShape(JoBatTokens.Radius.lg),
              extraLarge = RoundedCornerShape(JoBatTokens.Radius.xl),
          )
          KOTLIN

      - name: Generate Gradle wrapper
        working-directory: candidate/JObat
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run unit tests and assemble release APKs
        working-directory: candidate/JObat
        run: |
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleRelease

      - name: Verify APK outputs
        if: success()
        run: |
          set -e
          find candidate/JObat/app/build/outputs/apk/release -type f -name '*.apk' -print
          test -n "$(find candidate/JObat/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          for apk in candidate/JObat/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk =="
            file "$apk"
            sha256sum "$apk"
          done

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jobat-release-apks
          path: candidate/JObat/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobat-build-diagnostics
          path: |
            candidate/JObat/app/build/reports/
            candidate/JObat/*/build/reports/
            candidate/JObat/build/
          if-no-files-found: ignore
          retention-days: 7
